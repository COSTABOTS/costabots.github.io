<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>COSTABOTS | Tu restaurante, conectado</title>
  <meta name="description" content="Descubre COSTABOTS Experience.">
  <meta name="theme-color" content="#06111c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="COSTABOTS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="/public/brand/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/public/brand/apple-touch-icon.png">
  <style>
    :root { color-scheme: dark; --ink:#06111c; --panel:#0c1d2a; --blue:#3d9ec0; --gold:#d6ae6a; --ivory:#f5f1e8; --muted:#b8c6cc; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; }
    body { display:grid; min-height:100svh; place-items:center; padding:max(20px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left)); background:radial-gradient(circle at 83% 8%,rgba(61,158,192,.24),transparent 25%),radial-gradient(circle at 10% 92%,rgba(214,174,106,.17),transparent 30%),var(--ink); color:var(--ivory); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(100%,430px); padding:clamp(24px,5vw,36px); border:1px solid rgba(214,174,106,.34); border-radius:28px; background:linear-gradient(145deg,rgba(18,42,57,.96),rgba(6,17,28,.98)); box-shadow:0 25px 65px rgba(0,0,0,.38); text-align:center; }
    .brand { width:min(180px,56vw); height:auto; margin-bottom:clamp(28px,6vh,50px); }
    .eyebrow { margin:0 0 10px; color:var(--gold); font-size:.7rem; font-weight:800; letter-spacing:.17em; }
    h1 { margin:0; font-family:Georgia,"Times New Roman",serif; font-size:clamp(2.25rem,10vw,3.1rem); font-weight:500; line-height:.98; letter-spacing:-.055em; }
    .message { max-width:315px; margin:18px auto 0; color:var(--muted); font-size:1rem; line-height:1.55; }
    .features { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:24px 0; text-align:left; }
    .feature { min-height:58px; padding:11px; border:1px solid rgba(184,198,204,.15); border-radius:11px; background:rgba(255,255,255,.035); color:#dce6e8; font-size:.74rem; line-height:1.3; }
    .feature strong { display:block; margin-bottom:3px; color:var(--gold); font-size:.62rem; letter-spacing:.08em; }
    .qr-wrap { width:min(100%,250px); margin:0 auto; padding:13px; border-radius:16px; background:#fff; box-shadow:0 14px 28px rgba(0,0,0,.26); }
    .qr-wrap img { display:block; width:100%; height:auto; }
    .url { display:block; margin-top:13px; color:var(--gold); font-size:.79rem; font-weight:700; letter-spacing:.03em; text-decoration:none; }
    .hint { margin:15px 0 0; color:rgba(184,198,204,.72); font-size:.7rem; line-height:1.45; }
    @media (max-height:720px) { main { padding:22px 25px; } .brand { margin-bottom:24px; } .features { margin:18px 0; } .qr-wrap { width:190px; } }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="/public/brand/costabots-logo.png" alt="COSTABOTS">
    <p class="eyebrow">HOSPITALITY CONECTADO</p>
    <h1>Tu restaurante,<br>conectado.</h1>
    <p class="message">No te contamos cómo funciona. Pruébalo.</p>
    <div class="features" aria-label="Funciones de COSTABOTS">
      <div class="feature"><strong>01</strong>Reservas online</div>
      <div class="feature"><strong>02</strong>Assistant IA</div>
      <div class="feature"><strong>03</strong>Gestión centralizada</div>
      <div class="feature"><strong>04</strong>Automatizaciones</div>
    </div>
    <div class="qr-wrap"><img src="qr.svg" alt="Código QR para abrir COSTABOTS Experience"></div>
    <a class="url" href="https://costabots.com/experience/">costabots.com/experience</a>
    <p class="hint">Añade esta tarjeta a la pantalla de inicio para abrirla con un toque.</p>
  </main>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
